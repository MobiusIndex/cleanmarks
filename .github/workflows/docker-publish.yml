# Pushing a v* tag builds the image and publishes it to Docker Hub.
#
# It runs on GitHub's own runners, so publishing never depends on the maintainer's
# network, and a fork can publish its own image with no local setup.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME = Docker Hub username
#   DOCKERHUB_TOKEN    = Docker Hub PAT with read & write
name: Publish image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_REPO || 'indexmobius/cleanmarks' }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Watermarks Remover Web UI
            org.opencontainers.image.description=Self-hosted Web UI for the watermarks-remover engine
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
