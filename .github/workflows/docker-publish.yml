# 推 tag（v0.7.N）→ 自动构建并推送到 Docker Hub。
#
# 为什么要它：这台开发机 git push 过代理会卡死，而 Actions 跑在 GitHub 服务器上，
# 不经过本机网络，发镜像这条路最稳；别人 fork 后也能自己出一条镜像。
#
# 一次性设置（仓库 Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME = 你的 Docker Hub 用户名
#   DOCKERHUB_TOKEN   = Docker Hub 的 PAT（勾 read & write）
name: Publish image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_REPO || 'indexmobius/watermarks-remover-webui' }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Watermarks Remover Web UI
            org.opencontainers.image.description=Self-hosted Web UI for the watermarks-remover engine
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
