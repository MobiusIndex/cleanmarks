# 水印清理工具 —— 整套跑在 Docker 里，宿主机不留运行时文件。
#
#   docker compose up -d --build     启动（首次）
#   docker compose up -d             启动（镜像已构建）
#   docker compose logs -f web       看日志
#   docker compose down              停止并清理
#   docker compose down --rmi local  连同本项目镜像一起删
#
# 浏览器打开 http://127.0.0.1:8770
#
# 说明：只固定 wr-core 的镜像 digest 会让它绑死在一个版本上，用 tag 更便于
# 后续更新；web 镜像基于它构建，所以两者要一起更新。

name: watermarks-remover-webui

services:
  # 官方核心服务：文本 Layer A、图片/文档/音视频元数据与 C2PA 剥离。
  # 只在容器网络内暴露，不映射到宿主机端口，避免绕过界面直连。
  wr-core:
    image: ghcr.io/guillaumemeyer/watermarks-remover:latest
    expose:
      - "8765"
    environment:
      # 留空表示不鉴权。仅本机使用时可保持默认。
      WATERMARKS_SERVER_API_KEY: ${WATERMARKS_SERVER_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    restart: unless-stopped

  # 界面 + API 转发。浏览器不能直连 wr-core（它不发 CORS 头），
  # 纯文本的 Layer A 清理也在这里用进程内调用补上。
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: watermark-cleaner-web:local
    depends_on:
      - wr-core
    ports:
      # 默认只绑回环地址，外网访问不到。要局域网共享就把 .env 里的
      # WM_BIND 改成 0.0.0.0 —— 服务无鉴权，务必确认所在网络可信。
      - "${WM_BIND:-127.0.0.1}:${WM_PORT:-8770}:8770"
    environment:
      # 两容器模式：引擎在 wr-core 容器里，界面不要在本地再拉一个
      WATERMARKS_EMBEDDED: "0"
      WATERMARKS_UPSTREAM: http://wr-core:8765
      WATERMARKS_SCRIPTS: /app/scripts
      WATERMARKS_MAX_INPUT_BYTES: ${WATERMARKS_MAX_INPUT_BYTES:-268435456}
      WATERMARKS_MAX_BATCH_FILES: ${WATERMARKS_MAX_BATCH_FILES:-50}
      WATERMARKS_WEB_CONCURRENCY: ${WATERMARKS_WEB_CONCURRENCY:-2}
      WATERMARKS_WEB_TIMEOUT: ${WATERMARKS_WEB_TIMEOUT:-1800}
    read_only: true
    tmpfs:
      - /tmp
    init: true
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8770/api/ping',timeout=10)"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 15s